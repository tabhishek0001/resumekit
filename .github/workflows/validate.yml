name: Validate ResumeKit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check required product files
        run: |
          test -s index.html
          test -s assets/css/app.css
          test -s assets/js/app.js
          test -s PRODUCT-SPEC.md
          test -s tests/TEST-PLAN.md
